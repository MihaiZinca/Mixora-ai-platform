services:
  postgres:
    image: postgres:16
    container_name: mixora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mixora
      POSTGRES_PASSWORD: mixora
      POSTGRES_DB: mixora
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mixora-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: